<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Interactive study kit: readable notes, a spoken tutor, concept quizzes, flashcards, cases and memory aids." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='700' text-anchor='middle' fill='white'%3E%C2%A7%3C/text%3E%3C/svg%3E" />
    <title>Study Kit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Plus+Jakarta+Sans:wght@400..800&display=swap"
    />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('taxlaw-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <style>
      /* Shown while the subject's content loads; React replaces it. */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f6f5f1; }
      .boot span { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; color: #fff;
        font: 700 30px/1 Georgia, serif; background: linear-gradient(135deg, #4f46e5, #7c3aed);
        animation: boot-pulse 1.2s ease-in-out infinite alternate; }
      @keyframes boot-pulse { from { transform: scale(0.92); opacity: 0.7; } to { transform: scale(1); opacity: 1; } }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .boot { background: #0c0d13; } }
      :root[data-theme='dark'] .boot { background: #0c0d13; }
      @media (prefers-reduced-motion: reduce) { .boot span { animation: none; } }
    </style>
    <div id="root"><div class="boot" aria-label="Loading"><span>§</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
